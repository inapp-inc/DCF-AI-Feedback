# Generated snippet for /feedback/ (include inside the existing listen 443 server).
# Live install: sudo bash deploy/configure-nginx.sh
# That writes /etc/nginx/snippets/dcf-feedback.conf
#
# Do not replace location / or /fostercare/ belonging to other apps.

location = /feedback { return 301 /feedback/; }

location /feedback/ {
    proxy_pass http://127.0.0.1:14020/feedback/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
